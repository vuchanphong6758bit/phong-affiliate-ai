name: Affiliate AI - 06:00 Report

on:
  schedule:
    - cron: '0 23 * * *' # 06:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send KPI email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: vuchanphong6758@gmail.com
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          LAZADA_AFFILIATE_METRICS_URL: ${{ secrets.LAZADA_AFFILIATE_METRICS_URL }}
          USD_TO_VND: ${{ vars.USD_TO_VND }}
        run: python scripts/report.py
