name: FB + Shopee Affiliate
run-name: FB Shopee Affiliate ${{ github.run_id }}

on:
  schedule:
    - cron: '30 19 * * *'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fb-shopee-affiliate
  cancel-in-progress: false

env:
  GEMINI_MODEL: 'gemini-3.6-flash'
  PRODUCTS_FILE: 'data/shopee-products.csv'
  CAMPAIGN_START: '2026-09-23'
  CAMPAIGN_DAYS: '30'

jobs:
  affiliate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --quiet requests
      - name: Preflight credentials and product file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo 'MISSING_SECRET: GEMINI_API_KEY'; exit 1; }
          test -n "$FACEBOOK_PAGE_ID" || { echo 'MISSING_SECRET: FACEBOOK_PAGE_ID'; exit 1; }
          test -n "$FACEBOOK_PAGE_ACCESS_TOKEN" || { echo 'MISSING_SECRET: FACEBOOK_PAGE_ACCESS_TOKEN'; exit 1; }
          test -f "$PRODUCTS_FILE" || { echo "MISSING_FILE: $PRODUCTS_FILE"; exit 1; }
          echo 'PASS: core credentials and product file.'
      - name: Validate Facebook Page API
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, sys
          page_id=os.environ['FACEBOOK_PAGE_ID']; token=os.environ['FACEBOOK_PAGE_ACCESS_TOKEN']
          r=requests.get(f'https://graph.facebook.com/v26.0/{page_id}',params={'fields':'id,name','access_token':token},timeout=30)
          if not r.ok: print(f'FACEBOOK_API_FAILED: HTTP {r.status_code} {r.text}'); sys.exit(1)
          data=r.json(); print(f"PASS: Facebook Page API — {data.get('name')} ({data.get('id')})")
          PY
      - name: Remove accidental test post
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests
          post_id='1337765709414675_122106852387479564'
          r=requests.delete(f'https://graph.facebook.com/v26.0/{post_id}',params={'access_token':os.environ['FACEBOOK_PAGE_ACCESS_TOKEN']},timeout=30)
          print('Cleanup status:',r.status_code,r.text[:500])
          PY
      - name: Validate Shopee affiliate source
        env:
          SHOPEE_API_APP_ID: ${{ secrets.SHOPEE_API_APP_ID }}
          SHOPEE_API_SECRET: ${{ secrets.SHOPEE_API_SECRET }}
        run: |
          python3 - <<'PY'
          import csv, os, sys
          rows=list(csv.DictReader(open(os.environ['PRODUCTS_FILE'],encoding='utf-8-sig')))
          ready=[r for r in rows if (r.get('status') or '').upper()=='READY' and (r.get('affiliate_url') or r.get('product_url'))]
          if not ready: print('NO_READY_PRODUCT'); sys.exit(1)
          if any((r.get('affiliate_url') or '').strip() for r in ready): print('PASS: READY product already has an affiliate_url.'); sys.exit(0)
          if not os.environ.get('SHOPEE_API_APP_ID'): print('WAITING: Shopee approval/API credentials.'); sys.exit(1)
          if not os.environ.get('SHOPEE_API_SECRET'): print('WAITING: Shopee API secret is missing.'); sys.exit(1)
          print('PASS: Shopee API credentials present.')
          PY
      - name: Learn from previous Facebook results
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python3 scripts/fb_learning.py
      - name: Select product, create affiliate link and generate content
        id: content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          PRODUCTS_FILE: ${{ env.PRODUCTS_FILE }}
          SHOPEE_API_APP_ID: ${{ secrets.SHOPEE_API_APP_ID }}
          SHOPEE_API_SECRET: ${{ secrets.SHOPEE_API_SECRET }}
        run: python3 scripts/fb_shopee_generate.py
      - name: Publish visual post to Facebook Page
        id: publish
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          MESSAGE: ${{ steps.content.outputs.message }}
          LINK: ${{ steps.content.outputs.affiliate_url }}
        run: python3 scripts/fb_publish.py
      - name: Save run result
        if: always()
        env:
          PRODUCT_ID: ${{ steps.content.outputs.product_id }}
          PRODUCT_NAME: ${{ steps.content.outputs.product_name }}
          SCORE: ${{ steps.content.outputs.score }}
          POST_ID: ${{ steps.publish.outputs.post_id }}
          POST_TYPE: ${{ steps.publish.outputs.post_type }}
          POST_STATUS: ${{ job.status }}
        run: |
          mkdir -p data/runs
          python3 - <<'PY'
          import json, os
          from datetime import date
          start=date.fromisoformat(os.environ['CAMPAIGN_START']); day=(date.today()-start).days+1
          payload={'product_id':os.environ.get('PRODUCT_ID',''),'product_name':os.environ.get('PRODUCT_NAME',''),'score':os.environ.get('SCORE',''),'post_id':os.environ.get('POST_ID',''),'post_type':os.environ.get('POST_TYPE',''),'workflow_status':os.environ.get('POST_STATUS',''),'campaign_day':day,'campaign_days':int(os.environ['CAMPAIGN_DAYS']),'run_id':os.environ['GITHUB_RUN_ID']}
          with open(f"data/runs/{os.environ['GITHUB_RUN_ID']}.json",'w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runs data/learning
          git commit -m "chore: learn from FB affiliate run" || true
          git push || true
