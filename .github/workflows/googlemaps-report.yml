name: Nhoy Tea - Google Maps 06:00 Report

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 06:00 Vietnam time (UTC+7)
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: nhoytea-googlemaps-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect Google Business Profile metrics
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATION_NAME: ${{ secrets.GBP_LOCATION_NAME }}
        run: node googlemaps/googlemaps-report.mjs | tee googlemaps-report.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhoytea-googlemaps-report-${{ github.run_id }}
          path: googlemaps-report.json
      - name: Commit KPI history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/googlemaps-history.json
          git diff --cached --quiet || git commit -m 'Update Nhoy Tea Google Maps KPI history'
          git push
