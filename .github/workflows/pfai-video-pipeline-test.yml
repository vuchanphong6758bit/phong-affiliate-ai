name: PFAI Video Pipeline Test
run-name: PFAI video test
on:
  push:
    paths:
      - '.github/workflows/pfai-video-pipeline-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Check tools
        run: |
          set -e
          ffmpeg -version | head -n 1
          fc-match 'Noto Sans' | head -n 1
      - name: Render test video
        run: |
          set -e
          cat > /tmp/captions.ass <<'ASS'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Hook,Noto Sans,74,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,8,80,80,160,1
          Style: Body,Noto Sans,52,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,0,0,0,0,100,100,0,0,1,3,2,5,90,90,180,1
          Style: CTA,Noto Sans,58,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,2,90,90,180,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:04.00,Hook,,0,0,0,,Ghế ngồi ô tô trẻ em: 3 điểm cần kiểm tra
          Dialogue: 0,0:00:04.00,0:00:10.00,Body,,0,0,0,,Đừng chỉ nhìn giá. Hãy kiểm tra tiêu chuẩn và cách lắp đặt.
          Dialogue: 0,0:00:10.00,0:00:20.00,Body,,0,0,0,,Ưu tiên sản phẩm có thông tin rõ ràng và phù hợp nhu cầu sử dụng.
          Dialogue: 0,0:00:20.00,0:00:26.00,Body,,0,0,0,,Xem thông tin và đánh giá trước khi quyết định mua.
          Dialogue: 0,0:00:26.00,0:00:30.00,CTA,,0,0,0,,Xem sản phẩm ở TikTok Shop
          ASS
          mkdir -p /tmp/out
          ffmpeg -y -f lavfi -i 'testsrc2=size=1280x720:rate=30:duration=30' -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=/tmp/captions.ass:fontsdir=/usr/share/fonts/truetype/noto" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart -an /tmp/out/video.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name,pix_fmt -of json /tmp/out/video.mp4 | tee /tmp/out/probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/out/probe.json'))
          s=p['streams'][0]; size=int(p['format']['size']); dur=float(p['format']['duration'])
          assert (s['codec_name'],s['width'],s['height'],s['pix_fmt']) == ('h264',1080,1920,'yuv420p')
          assert 29.9 <= dur <= 30.1
          assert size <= 64*1024*1024
          print(f'PASS: {dur:.2f}s {size/1024/1024:.2f}MiB 1080x1920 H264')
          PY
      - name: Archive test video
        uses: actions/upload-artifact@v4
        with:
          name: pfai-video-test
          path: /tmp/out/video.mp4
          retention-days: 1
