name: Affiliate AI - Daily Engine

on:
  schedule:
    - cron: '0 22 * * *' # 05:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Research products, generate and publish content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LAZADA_AFFILIATE_FEED_URL: ${{ secrets.LAZADA_AFFILIATE_FEED_URL }}
          PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}
          MIN_EXPECTED_AD_COST_PER_ORDER: ${{ vars.MIN_EXPECTED_AD_COST_PER_ORDER }}
          MIN_EXPECTED_PROFIT_VND: ${{ vars.MIN_EXPECTED_PROFIT_VND }}
        run: python scripts/engine.py
      - name: Persist learning state
        run: |
          git config user.name 'affiliate-ai-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet || git commit -m 'chore: persist daily affiliate learning state'
          git push
