name: PFAI Free Video Pipeline
run-name: PFAI video ${{ github.run_id }}

on:
  push:
    paths:
      - '.github/workflows/pfai-free-video.yml'
  workflow_dispatch:
    inputs:
      title:
        description: TikTok title
        required: true
        type: string
        default: 'Ghế ngồi ô tô trẻ em: 3 điểm cần kiểm tra'
      hook:
        description: Hook text
        required: true
        type: string
        default: 'Ghế ngồi ô tô trẻ em: 3 điểm cần kiểm tra'
      body:
        description: Main content text
        required: true
        type: string
        default: 'Đừng chỉ nhìn giá. Hãy kiểm tra tiêu chuẩn, cách lắp đặt và thông tin sản phẩm trước khi mua.'
      cta:
        description: CTA text
        required: true
        type: string
        default: 'Xem sản phẩm ở TikTok Shop'
      image_url:
        description: Optional HTTPS product image URL
        required: false
        type: string
        default: ''
      duration:
        description: Video duration in seconds
        required: true
        type: number
        default: 30
      mode:
        description: TikTok mode
        required: true
        type: choice
        options:
          - sandbox
          - production
        default: sandbox
      privacy_level:
        description: TikTok privacy level
        required: true
        type: string
        default: SELF_ONLY

permissions:
  contents: write

jobs:
  render-test:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          ffmpeg -version | head -n 1
      - name: Render deterministic test video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pfai
          cat > /tmp/pfai/captions.ass <<'ASS'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Hook,Noto Sans,74,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,8,80,80,160,1
          Style: Body,Noto Sans,52,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,0,0,0,0,100,100,0,0,1,3,2,5,90,90,180,1
          Style: CTA,Noto Sans,58,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,2,90,90,180,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:04.00,Hook,,0,0,0,,Ghế ngồi ô tô trẻ em: 3 điểm cần kiểm tra
          Dialogue: 0,0:00:04.00,0:00:20.00,Body,,0,0,0,,Đừng chỉ nhìn giá. Hãy kiểm tra tiêu chuẩn và cách lắp đặt.
          Dialogue: 0,0:00:20.00,0:00:26.00,Body,,0,0,0,,Ưu tiên sản phẩm có thông tin rõ ràng và phù hợp nhu cầu sử dụng.
          Dialogue: 0,0:00:26.00,0:00:30.00,CTA,,0,0,0,,Xem sản phẩm ở TikTok Shop
          ASS
          ffmpeg -y -f lavfi -i 'testsrc2=size=1280x720:rate=30:duration=30' -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=/tmp/pfai/captions.ass:fontsdir=/usr/share/fonts/truetype/noto" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart -an /tmp/pfai/test.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name,pix_fmt -of json /tmp/pfai/probe.json > /tmp/pfai/probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pfai/probe.json'))
          s=p['streams'][0]; size=int(p['format']['size']); dur=float(p['format']['duration'])
          assert (s['codec_name'],s['width'],s['height'],s['pix_fmt']) == ('h264',1080,1920,'yuv420p')
          assert 29.9 <= dur <= 30.1
          assert size <= 64*1024*1024
          print(f'PASS FFmpeg: {dur:.2f}s {size/1024/1024:.2f}MiB 1080x1920 H264')
          PY
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfai-free-video-test
          path: /tmp/pfai/test.mp4
          retention-days: 1

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Render video
        id: render
        env:
          TITLE: ${{ inputs.title }}
          HOOK: ${{ inputs.hook }}
          BODY: ${{ inputs.body }}
          CTA: ${{ inputs.cta }}
          IMAGE_URL: ${{ inputs.image_url }}
          DURATION: ${{ inputs.duration }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pfai
          python3 - <<'PY'
          import os
          def esc(s):
              return str(s or '').replace('\\','\\\\').replace('{','\\{').replace('}','\\}').replace('\n','\\N')
          d=max(10,min(60,float(os.environ.get('DURATION','30'))))
          hook=esc(os.environ.get('HOOK'))
          body=esc(os.environ.get('BODY'))
          cta=esc(os.environ.get('CTA'))
          def ts(sec):
              return f'{int(sec//60)}:{sec%60:05.2f}'
          body_end=max(6,d-4)
          ass=f'''[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Hook,Noto Sans,74,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,8,80,80,160,1\nStyle: Body,Noto Sans,52,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,0,0,0,0,100,100,0,0,1,3,2,5,90,90,180,1\nStyle: CTA,Noto Sans,58,&H00FFFFFF,&H00FFFFFF,&H00111111,&H90000000,1,0,0,0,100,100,0,0,1,4,2,2,90,90,180,1\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\nDialogue: 0,0:00:00.00,0:00:04.00,Hook,,0,0,0,,{hook}\nDialogue: 0,0:00:04.00,0:{ts(body_end)},Body,,0,0,0,,{body}\nDialogue: 0,0:{ts(body_end)},0:{ts(d)},CTA,,0,0,0,,{cta}\n'''
          open('/tmp/pfai/captions.ass','w',encoding='utf-8').write(ass)
          PY
          if [ -n "$IMAGE_URL" ]; then
            case "$IMAGE_URL" in https://*) ;; *) echo 'image_url must use HTTPS'; exit 1;; esac
            curl --fail --location --max-time 30 --output /tmp/pfai/source.jpg "$IMAGE_URL"
            ffmpeg -y -loop 1 -i /tmp/pfai/source.jpg -t "$DURATION" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=/tmp/pfai/captions.ass:fontsdir=/usr/share/fonts/truetype/noto" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart -an /tmp/pfai/video.mp4
          else
            ffmpeg -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=$DURATION" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=/tmp/pfai/captions.ass:fontsdir=/usr/share/fonts/truetype/noto" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart -an /tmp/pfai/video.mp4
          fi
          SIZE=$(stat -c%s /tmp/pfai/video.mp4)
          [ "$SIZE" -le $((64*1024*1024)) ]
          echo "video_size=$SIZE" >> "$GITHUB_OUTPUT"
      - name: Publish video as GitHub release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="pfai-video-${GITHUB_RUN_ID}"
          gh release create "$TAG" /tmp/pfai/video.mp4 --repo "$GITHUB_REPOSITORY" --title "PFAI video $GITHUB_RUN_ID" --notes "Generated by PFAI free FFmpeg pipeline."
          echo "video_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/video.mp4" >> "$GITHUB_OUTPUT"
          echo "Release video URL created."
      - name: Send video to TikTok automation
        id: tiktok
        env:
          TIKTOK_AUTOMATION_KEY: ${{ secrets.TIKTOK_AUTOMATION_KEY }}
          MODE: ${{ inputs.mode }}
          PRIVACY: ${{ inputs.privacy_level }}
          TITLE: ${{ inputs.title }}
          VIDEO_URL: ${{ steps.release.outputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/pfai/request.json
          import json,os
          print(json.dumps({"mode":os.environ["MODE"],"privacy_level":os.environ["PRIVACY"],"title":os.environ["TITLE"],"video_url":os.environ["VIDEO_URL"],"is_aigc":True,"consent":True}))
          PY
          curl --fail --silent --show-error -X POST 'https://phong-affiliate-ai.vercel.app/api/tiktok/automation' -H 'Content-Type: application/json' -H "x-api-key: $TIKTOK_AUTOMATION_KEY" --data-binary @/tmp/pfai/request.json > /tmp/pfai/init.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pfai/init.json'))
          assert d.get('success') is True, d
          assert d.get('publish_id'), d
          open('/tmp/pfai/publish_id','w').write(d['publish_id'])
          print('TikTok Direct Post init PASS')
          PY
      - name: Verify TikTok status
        env:
          TIKTOK_AUTOMATION_KEY: ${{ secrets.TIKTOK_AUTOMATION_KEY }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_ID=$(cat /tmp/pfai/publish_id)
          for i in $(seq 1 12); do
            curl --fail --silent --show-error -X POST 'https://phong-affiliate-ai.vercel.app/api/tiktok/automation' -H 'Content-Type: application/json' -H "x-api-key: $TIKTOK_AUTOMATION_KEY" --data "{\"action\":\"status\",\"mode\":\"$MODE\",\"publish_id\":\"$PUBLISH_ID\"}" > /tmp/pfai/status.json
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/pfai/status.json')).get('status',''))")
            echo "TikTok status: $STATUS"
            case "$STATUS" in
              PUBLISH_COMPLETE) exit 0;;
              FAILED|SEND_TO_USER_INBOX_FAILED|PROCESSING_FAILED) cat /tmp/pfai/status.json; exit 1;;
            esac
            sleep 10
          done
          cat /tmp/pfai/status.json
          exit 1
      - name: Save TikTok post history
        if: ${{ success() }}
        env:
          TIKTOK_AUTOMATION_KEY: ${{ secrets.TIKTOK_AUTOMATION_KEY }}
          MODE: ${{ inputs.mode }}
          TITLE: ${{ inputs.title }}
          VIDEO_URL: ${{ steps.release.outputs.video_url }}
          PRIVACY: ${{ inputs.privacy_level }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_ID=$(cat /tmp/pfai/publish_id)
          POST_ID=$(python3 -c "import json; d=json.load(open('/tmp/pfai/status.json')); print((d.get('publicly_available_post_id') or [''])[0])")
          STATUS=$(python3 -c "import json; print(json.load(open('/tmp/pfai/status.json')).get('status',''))")
          python3 - <<'PY' > /tmp/pfai/history.json
          import json, os
          print(json.dumps({
            "mode": os.environ["MODE"],
            "publish_id": open("/tmp/pfai/publish_id").read().strip(),
            "publicly_available_post_id": os.environ.get("POST_ID", ""),
            "title": os.environ["TITLE"],
            "video_url": os.environ["VIDEO_URL"],
            "privacy_level": os.environ["PRIVACY"],
            "status": os.environ["STATUS"],
          }))
          PY
          curl --fail --silent --show-error -X POST 'https://phong-affiliate-ai.vercel.app/api/tiktok/history' -H 'Content-Type: application/json' -H "x-api-key: $TIKTOK_AUTOMATION_KEY" --data-binary @/tmp/pfai/history.json > /tmp/pfai/history-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pfai/history-response.json'))
          assert d.get('success') is True, d
          print('TikTok post history save PASS')
          PY
